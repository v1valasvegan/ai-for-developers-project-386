[package]
name = "okoshko-backend"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
headers = "0.4.2"
http = "1.5.0"
okoshko_api = { path = "generated", version = "0.1.0" }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"
