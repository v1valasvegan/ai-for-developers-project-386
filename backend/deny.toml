[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.8
# Approved by the project owner: MPL applies only to these transitive files.
# Exact versions require reviewing the allowance when the generator's dependencies change.
exceptions = [
  { crate = "cssparser@0.38.0", allow = [
    "MPL-2.0",
  ] },
  { crate = "dtoa-short@0.3.5", allow = [
    "MPL-2.0",
  ] },
]

[bans]
# Different transitive major versions can coexist; we do not impose deduplication.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
